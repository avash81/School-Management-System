[project]
name = "schoolos-ai-service"
version = "0.1.0"
description = "FastAPI AI service for SchoolOS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]

[tool.uvicorn]
factory = false

[tool.pytest.ini_options]
addopts = "-q"
