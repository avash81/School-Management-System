name: Bug Report
description: Report a defect in SchoolOS
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include reproduction steps and environment details.
