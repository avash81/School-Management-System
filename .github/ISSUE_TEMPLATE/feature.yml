name: Feature Request
description: Propose a SchoolOS feature or enhancement
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What are we solving?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define done clearly.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical Notes
      description: Any architectural or implementation notes.
